name: Build APK

on:
  push:
    tags: ['v*']          # tag v1.0, v1.1 ... to publish a release
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TimeBlock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TimeBlock-apk
          path: TimeBlock.apk

      - name: Publish release (tag push)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TimeBlock.apk --title "TimeBlock $GITHUB_REF_NAME" --generate-notes

      - name: Publish release (manual run)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" TimeBlock.apk --title "TimeBlock build ${{ github.run_number }}" --notes "Manual build" --target "${{ github.sha }}"
